services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: misekin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: misekin
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misekin"]
      interval: 5s
      timeout: 5s
      retries: 10

  # シフト自動生成ソルバー（CP-SAT / OR-Tools）
  solver:
    build: ./solver
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      DATABASE_URL: postgresql://misekin:${POSTGRES_PASSWORD}@db:5432/misekin
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_BASE_PATH: /dev/misekin
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-みせ勤 <noreply@dataraw.jp>}
      # コンテナ間はサービス名で解決
      SHIFT_SOLVER_URL: http://solver:8000
      # シフトルールのAI翻訳用（未設定なら翻訳機能のみ無効・他は動作）
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 公開前LPの合言葉。未設定だとLPが誰でも見える状態になるので、
      # 公開まではサーバの .env に必ず入れておくこと
      LP_PASSWORD: ${LP_PASSWORD:-}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      solver:
        condition: service_started
    restart: unless-stopped

volumes:
  db_data:
